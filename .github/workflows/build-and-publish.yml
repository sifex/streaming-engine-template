# Github Actions Workflow. Generated by gradlewise plugin (ver. 1.22.15)
# All manual changes to this file will be LOST on the next build.

name: "GradleWise"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
  ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
  DEPLOY_IMAGE_NAME: streaming-engine-template
  DEPLOY_REGISTRY_URL: ${{ secrets.DEPLOY_REGISTRY_URL }}
  DEPLOY_SLACK_CHANNEL: '#stream-processing-updates'
  GA_GIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GA_WISE_GRADLE_LOGGING_ENABLED: ${{ vars.GA_WISE_GRADLE_LOGGING_ENABLED }}
  KAFKA_HOST: kafka
  REKOR_URL: ${{ vars.REKOR_URL }}
  SCHEMA_REGISTRY_HOST: schema-registry
  ZK_KAFKA_HOST: zk-kafka

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  matrix-test-libs:
    name: "Matrix Test Libs"
    runs-on: gha-production-xlarge
    container: ci-images-release.arti.tw.ee/actions_java21

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        boot_platform_artifact: [wise-boot-3.3-dependencies, wise-boot-3.4-dependencies]

    services:
      zk-kafka:
        image: docker-hub.tw.ee/confluentinc/cp-zookeeper:7.2.1
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
      kafka:
        image: docker-hub.tw.ee/confluentinc/cp-kafka:7.2.1
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://:9092
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
          KAFKA_BROKER_ID: 1
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 7200000
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_ZOOKEEPER_CONNECT: zk-kafka:2181
      schema-registry:
        image: docker-hub.tw.ee/confluentinc/cp-schema-registry:7.2.1
        env:
          SCHEMA_REGISTRY_HOST_NAME: schema-registry
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
          SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: zk-kafka:2181
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

    steps:
      - name: "Checkout git repo"
        uses: actions/checkout@v4
      - name: "Add repo as safe directory"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Determine Branch"
        id: branch
        uses: transferwise/sanitize-branch-name@v1
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          # Remove unused files from ~/.gradle so that it doesn't grow crazy-large
          gradle-home-cache-cleanup: true
          # Include jdks and wrappers directories to cache alongside default caches and notifications directories
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          # Exclude local build-cache and keyrings as they will be different for each workflow run
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches-keyrings
      - name: "Compile classes"
        run: gradle --console=plain --stacktrace --info :interfaces:classes
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
      - name: "Run matrix test"
        run: gradle --console=plain --stacktrace --info :interfaces:check -PwiseJavaLibraryBootPlatformArtifact=${{ matrix.boot_platform_artifact }}
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: ":interfaces:integrationTest (junitXml)-${{ matrix.boot_platform_artifact }}"
          report_paths: 'interfaces/build/test-results/integrationTest/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "matrix-test-libs"
          comment: true
          detailed_summary: true
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: ":interfaces:test (junitXml)-${{ matrix.boot_platform_artifact }}"
          report_paths: 'interfaces/build/test-results/test/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "matrix-test-libs"
          comment: true
          detailed_summary: true
      - name: "Collect reports"
        run: gradle --console=plain --stacktrace zipReport
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
          PUBLISH_REQUESTED: ${{ steps.trigger-docker.outputs.docker-upload }}
        if: always()
      - name: "Store test results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-test-reports-${{ matrix.boot_platform_artifact }}
          path: "./build/combinedReports.zip"
          retention-days: 7

  build-and-test:
    name: "Build And Test"
    runs-on: gha-production-xlarge
    container: ci-images-release.arti.tw.ee/actions_java21
    outputs:
      publish-docker-snapshot: ${{ steps.trigger-docker.outputs.docker-upload }}
      subjectsBase64Handle: ${{ steps.prepare-subjects.outputs.subjectsBase64Handle }}

    env:
      ENV_STREAM_PROCESSING_TEST_CLUSTER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENV_STREAM_PROCESSING_TEST_CLUSTER_SCHEMA_REGISTRY_HOSTS: http://schema-registry:8081
      ENV_STREAM_PROCESSING_TEST_CLUSTER_TEST_CONTAINERS_ENABLED: false

    services:
      zk-kafka:
        image: docker-hub.tw.ee/confluentinc/cp-zookeeper:7.2.1
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
      kafka:
        image: docker-hub.tw.ee/confluentinc/cp-kafka:7.2.1
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://:9092
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
          KAFKA_BROKER_ID: 1
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 7200000
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_ZOOKEEPER_CONNECT: zk-kafka:2181
      schema-registry:
        image: docker-hub.tw.ee/confluentinc/cp-schema-registry:7.2.1
        env:
          SCHEMA_REGISTRY_HOST_NAME: schema-registry
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
          SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: zk-kafka:2181
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

    steps:
      - name: "Checkout git repo"
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 1st commit is merge commit, we need one more to understand if snapshot is requested.
      # Work around git repo permissions issues
      # See: https://github.com/transferwise/gradlewise/issues/60
      - name: "Add repo as safe directory"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Check commit message for snapshot publishing"
        id: trigger-docker
        run: |
          set +x
          set +e
          git log --format='%s %b' -n 1 --skip 1 | grep -i '#publish-snapshot'
          if [ $? -eq 0 ]; then
            echo "Snapshot image is requested"
            echo "docker-upload=true" >> $GITHUB_OUTPUT;
          else
            echo "Snapshot image is not requested"
            echo "docker-upload=false" >> $GITHUB_OUTPUT;
          fi
        shell: bash
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          # Remove unused files from ~/.gradle so that it doesn't grow crazy-large
          gradle-home-cache-cleanup: true
          # Include jdks and wrappers directories to cache alongside default caches and notifications directories
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          # Exclude local build-cache and keyrings as they will be different for each workflow run
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches-keyrings
      - name: "Determine Branch"
        id: branch
        uses: transferwise/sanitize-branch-name@v1
      - name: "Assemble binaries"
        run: gradle --console=plain --stacktrace assemble bootJar testClasses
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
          PUBLISH_REQUESTED: ${{ steps.trigger-docker.outputs.docker-upload }}
      - name: "Run tests"
        run: gradle --console=plain --stacktrace --info check
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
          PUBLISH_REQUESTED: ${{ steps.trigger-docker.outputs.docker-upload }}
      - name: "Validate artifacts deployment-example"
        uses: transferwise/slsa-checks/validate-artifacts@main
        with:
          artifactory_api_key: "${{ secrets.ARTIFACTORY_API_KEY }}"
          artifacts_json: "deployment-example/build/wise-spring-boot-build/non-local-dependencies.json"
          target_repo: "${{ github.repository }}"
          result_suffix: "deployment-example"
      - name: "Wait for Kafka"
        run: |
          dockerize -wait tcp://kafka:9092 -timeout 1m
      - name: "Wait for Schema Registry"
        run: |
          dockerize -wait tcp://schema-registry:8081 -timeout 1m
      - name: "Run integration tests"
        run: gradle --console=plain --stacktrace --info integrationTest
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
          PUBLISH_REQUESTED: ${{ steps.trigger-docker.outputs.docker-upload }}
      - name: "Publish"
        run: gradle --console=plain --stacktrace --info publish
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
          PUBLISH_REQUESTED: ${{ steps.trigger-docker.outputs.docker-upload }}
      - uses: transferwise/slsa-checks/prepare-subjects@main
        id: prepare-subjects
        with:
          artifactory_api_key: '${{ secrets.ARTIFACTORY_API_KEY }}'
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: ":deployment-example:integrationTest (junitXml)"
          report_paths: 'deployment-example/build/test-results/integrationTest/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "build-and-test"
          comment: true
          detailed_summary: true
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: ":deployment-example:test (junitXml)"
          report_paths: 'deployment-example/build/test-results/test/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "build-and-test"
          comment: true
          detailed_summary: true
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: ":integrationTest (junitXml)"
          report_paths: 'build/test-results/integrationTest/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "build-and-test"
          comment: true
          detailed_summary: true
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: ":interfaces:integrationTest (junitXml)"
          report_paths: 'interfaces/build/test-results/integrationTest/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "build-and-test"
          comment: true
          detailed_summary: true
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: ":interfaces:test (junitXml)"
          report_paths: 'interfaces/build/test-results/test/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "build-and-test"
          comment: true
          detailed_summary: true
      - name: "Publish Test Report"
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: ":test (junitXml)"
          report_paths: 'build/test-results/test/**/*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          job_name: "build-and-test"
          comment: true
          detailed_summary: true
      - name: "Collect reports"
        run: gradle --console=plain --stacktrace zipReport
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
          PUBLISH_REQUESTED: ${{ steps.trigger-docker.outputs.docker-upload }}
        if: always()
      - name: "Store test results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-test-reports
          path: "./build/combinedReports.zip"
          retention-days: 7
      - name: "Store working directory"
        uses: actions/cache/save@v4
        with:
          path: .
          key: "${{ github.sha }}"

  publish-streaming-engine-image_seiLocalImage_protobufDemo:
    name: "[seiLocalImage_protobufDemo] Publish Streaming Engine Image"
    needs:
      - build-and-test
    runs-on: gha-production-xlarge
    container: ci-images-release.arti.tw.ee/actions_java21
    if: ${{ github.ref == 'refs/heads/main' || needs.build-and-test.outputs.publish-docker-snapshot == 'true' }}
    outputs:
      digest: ${{ steps.sei-push.outputs.digest }}
      pushed-images: ${{ steps.sei-push.outputs.sei-push-output }}

    steps:
      - name: "Install Docker"
        run: |
          if ! command -v docker &> /dev/null
          then
              echo "docker could not be found, will install one"
              apt-get update
              apt-get install docker.io -y
          fi
        shell: bash
      - name: "Checkout git repo"
        uses: actions/checkout@v4
      - name: "Add repo as safe directory"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          # Remove unused files from ~/.gradle so that it doesn't grow crazy-large
          gradle-home-cache-cleanup: true
          # Include jdks and wrappers directories to cache alongside default caches and notifications directories
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          # Exclude local build-cache and keyrings as they will be different for each workflow run
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches-keyrings
      - name: "Determine Branch"
        id: branch
        uses: transferwise/sanitize-branch-name@v1
      - name: "Build SEI Image"
        run: gradle --console=plain --stacktrace seiLocalImage_protobufDemo
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
          PUBLISH_REQUESTED: ${{ steps.trigger-docker.outputs.docker-upload }}
      - name: Checkout sei-publish-action Repo
        uses: actions/checkout@v4
        with:
          repository: transferwise/sei-publish-action
          ref: v2.7
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          path: .github/actions/sei-publish-action
      - name: Run SEI Publish Action
        id: sei-push
        uses: ./.github/actions/sei-publish-action
        with:
          run-type: push

  provenance-container_seiLocalImage_protobufDemo:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [publish-streaming-engine-image_seiLocalImage_protobufDemo]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: transferwise/slsa-generator/.github/workflows/generator_container_slsa3.yml@main
    with:
      image: ${{ needs.publish-streaming-engine-image_seiLocalImage_protobufDemo.outputs.pushed-images }}
      digest: ${{ needs.publish-streaming-engine-image_seiLocalImage_protobufDemo.outputs.digest }}
    secrets: inherit

  sei-promote-image_seiLocalImage_protobufDemo:
    name: "[seiLocalImage_protobufDemo] Promote Streaming Engine Image"
    needs:
      - provenance-container_seiLocalImage_protobufDemo
      - publish-streaming-engine-image_seiLocalImage_protobufDemo
    runs-on: gha-production-medium
    container: ci-images-release.arti.tw.ee/k8s-deployer:4
    if: ${{ github.ref == 'refs/heads/main' }}

    env:
      GH_ACCESS_TOKEN: ${{ secrets.K8S_PROMOTION_TOKEN }}

    steps:
      - name: "Checkout git repo"
        uses: actions/checkout@v4
      - name: "Add repo as safe directory"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout sei-publish-action Repo
        uses: actions/checkout@v4
        with:
          repository: transferwise/sei-publish-action
          ref: v2.7
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          path: .github/actions/sei-publish-action
      - name: Run SEI Promote Action
        uses: ./.github/actions/sei-publish-action
        with:
          run-type: promote
          images-to-promote: ${{ needs.publish-streaming-engine-image_seiLocalImage_protobufDemo.outputs.pushed-images }}

  sonarqube-analysis:
    name: "Sonarqube Analysis"
    needs:
      - build-and-test
    runs-on: gha-production-xlarge
    container: ci-images-release.arti.tw.ee/actions_java21
    if: ${{ github.ref == 'refs/heads/main' }}

    env:
      SONARQUBE_HOST: ${{ vars.SONARQUBE_URL }}
      SONARQUBE_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

    steps:
      - name: "Restore working directory"
        uses: actions/cache/restore@v4
        with:
          path: .
          key: "${{ github.sha }}"
          fail-on-cache-miss: true
      - name: "Add repo as safe directory"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          # Remove unused files from ~/.gradle so that it doesn't grow crazy-large
          gradle-home-cache-cleanup: true
          # Include jdks and wrappers directories to cache alongside default caches and notifications directories
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          # Exclude local build-cache and keyrings as they will be different for each workflow run
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches-keyrings
      - name: "Determine Branch"
        id: branch
        uses: transferwise/sanitize-branch-name@v1
      - name: "Run SonarQube analysis"
        continue-on-error: true
        shell: bash
        run: |
          PR=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")
          BRANCH=${{ steps.branch.outputs.branch-name }}
          if [ $BRANCH != 'main' ] && [ $PR != null ]; then
            export SONAR_PR_PARAMS=" \
              -Dsonar.pullrequest.key=$PR \
              -Dsonar.pullrequest.branch=$BRANCH \
              -Dsonar.pullrequest.base=main";
          fi
          gradle sonarqube \
            -Dsonar.projectKey=$DEPLOY_IMAGE_NAME \
            -Dsonar.projectName=$DEPLOY_IMAGE_NAME \
            -Dsonar.host.url=$SONARQUBE_HOST \
            -Dsonar.login=$SONARQUBE_TOKEN \
            ${SONAR_PR_PARAMS} \
            --info --no-daemon

  provenance:
    if: ${{ github.ref == 'refs/heads/main' && needs.build-and-test.outputs.subjectsBase64Handle }}
    needs: [build-and-test]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: transferwise/slsa-generator/.github/workflows/generator_generic_slsa3.yml@v1.9.0
    with:
      base64-subjects-as-file: "${{ needs.build-and-test.outputs.subjectsBase64Handle }}"
      upload-assets: true
      # AppSec staging Rekor instance for test
      # Can only be accessed from GHA staging
      private-rekor-url: ${{ vars.REKOR_URL }}
      provenance-name: "${{ github.event.repository.name }}-provenance.intoto.jsonl"
    secrets: inherit

