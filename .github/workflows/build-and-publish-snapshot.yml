# Github Actions Workflow. Generated by gradlewise plugin (ver. 1.22.15)
# All manual changes to this file will be LOST on the next build.

name: Build & publish docker snapshot

# Run this workflow manually:
# Repo - Actions - "Build & publish docker snapshot" - "Run workflow"
#
# This will build image from your branch and publish it

on:
  workflow_dispatch
env:
  ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
  ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
  DEPLOY_IMAGE_NAME: streaming-engine-template
  DEPLOY_REGISTRY_URL: ${{ secrets.DEPLOY_REGISTRY_URL }}
  DEPLOY_SLACK_CHANNEL: '#stream-processing-updates'
  GA_GIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GA_WISE_GRADLE_LOGGING_ENABLED: ${{ vars.GA_WISE_GRADLE_LOGGING_ENABLED }}
  KAFKA_HOST: kafka
  REKOR_URL: ${{ vars.REKOR_URL }}
  SCHEMA_REGISTRY_HOST: schema-registry
  ZK_KAFKA_HOST: zk-kafka
jobs:
  publish-streaming-engine-image_seiLocalImage_protobufDemo:
    name: "[seiLocalImage_protobufDemo] Publish Streaming Engine Image"
    runs-on: gha-production-xlarge
    container: ci-images-release.arti.tw.ee/actions_java21
    outputs:
      digest: ${{ steps.sei-push.outputs.digest }}
      pushed-images: ${{ steps.sei-push.outputs.sei-push-output }}

    steps:
      - name: "Install Docker"
        run: |
          if ! command -v docker &> /dev/null
          then
              echo "docker could not be found, will install one"
              apt-get update
              apt-get install docker.io -y
          fi
        shell: bash
      - name: "Checkout git repo"
        uses: actions/checkout@v4
      - name: "Add repo as safe directory"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
          # Remove unused files from ~/.gradle so that it doesn't grow crazy-large
          gradle-home-cache-cleanup: true
          # Include jdks and wrappers directories to cache alongside default caches and notifications directories
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          # Exclude local build-cache and keyrings as they will be different for each workflow run
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches-keyrings
      - name: "Determine Branch"
        id: branch
        uses: transferwise/sanitize-branch-name@v1
      - name: "Build SEI Image"
        run: gradle --console=plain --stacktrace seiLocalImage_protobufDemo
        env:
          GA_GIT_BRANCH: ${{ steps.branch.outputs.sanitized-branch-name }}
          PUBLISH_REQUESTED: ${{ steps.trigger-docker.outputs.docker-upload }}
      - name: Checkout sei-publish-action Repo
        uses: actions/checkout@v4
        with:
          repository: transferwise/sei-publish-action
          ref: v2.7
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          path: .github/actions/sei-publish-action
      - name: Run SEI Publish Action
        id: sei-push
        uses: ./.github/actions/sei-publish-action
        with:
          run-type: push

