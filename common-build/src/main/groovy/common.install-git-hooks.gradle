import org.apache.tools.ant.taskdefs.condition.Os

logger.lifecycle "Installing git hooks. Root directory is '$rootDir'."

task copyGitHooks(type: Copy) {
    description 'Copies the git hooks from "git-hooks" to the .git folder.'
    from("${rootDir}/git-hooks/") {
        include '**/*.sh'
        rename '(.*).sh', '$1'
    }
    into "${rootDir}/.git/hooks"
    onlyIf { Os.isFamily(Os.FAMILY_UNIX) }
}

task installGitHooks(type: Exec) {
    description 'Installs the git hooks from "git-hooks".'
    group 'git hooks'
    workingDir rootDir
    commandLine 'chmod'
    args '-R', '+x', '.git/hooks/'
    dependsOn copyGitHooks
    onlyIf { Os.isFamily(Os.FAMILY_UNIX) }
    doLast { logger.lifecycle('Git hook installed successfully.') }
}

afterEvaluate {
    tasks['init'].dependsOn installGitHooks
    tasks['wrapper'].dependsOn installGitHooks
}